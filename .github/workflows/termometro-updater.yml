name: Actualizador del Termómetro Social de Jujuy

on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'frontend/data.json'
      - 'frontend/index.html'
      - 'data/**'
      - 'README.md'
      - '.gitignore'

concurrency:
  group: termometro-updater
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Scraper y Analizador de Noticias Reales
        run: |
          python run.py --scrape

      - name: Exportar datos estáticos para Netlify
        run: |
          python export_static.py
          python build_standalone.py

      - name: Guardar y commitear cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data.json frontend/index.html data/termometro.db
          if git diff --staged --quiet; then
            echo "No hay noticias nuevas para commitear."
            exit 0
          fi
          git commit -m "🔄 Actualización automática de noticias y termómetro social"
          for intento in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin main && break
            echo "Reintentando push ($intento)..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de frontend a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend'

      - name: Desplegar sitio en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
